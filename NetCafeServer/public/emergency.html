<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Softech Favqulodda rejim</title><style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#fafafa;font:14px system-ui;padding:24px}.wrap{max-width:1100px;margin:auto}.warn{background:#2b1608;border:1px solid #f59e0b;border-radius:16px;padding:18px;margin-bottom:18px}.warn h1{color:#fbbf24;margin:0 0 8px;font-size:22px}.muted{color:#a1a1aa}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}input,select,button{border-radius:9px;border:1px solid #3f3f46;background:#18181b;color:#fff;padding:10px}input{min-width:190px}button{cursor:pointer;background:#0ea5e9;color:#001018;font-weight:700}.retry{background:#27272a;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.card{border:1px solid #27272a;background:#111113;border-radius:14px;padding:15px}.online{color:#4ade80}.active{color:#fbbf24}.error{color:#fb7185;min-height:22px}.session{font-size:12px;color:#d4d4d8;margin:8px 0}.card button{width:100%;margin-top:8px}</style></head><body><div class="wrap">
<div class="warn"><h1>Favqulodda ish rejimi</h1><div>Asosiy baza ishlamayapti. Bu yerda faqat vaqtli seans ochiladi. Narx, balans, bar, VIP/Postpaid va moliyaviy hisobot hisoblanmaydi. Har bir amal alohida favqulodda jurnalga yoziladi.</div></div>
<div class="top"><input id="operator" placeholder="Kassir ismi" maxlength="80"><input id="note" placeholder="Sabab/izoh" maxlength="80"><button class="retry" onclick="retryMain()">Asosiy serverni qayta sinash</button><span id="meta" class="muted"></span></div><div id="error" class="error"></div><div id="grid" class="grid"></div></div>
<script>
const api=async(url,options={})=>{const response=await fetch(url,{cache:'no-store',...options,headers:{'Content-Type':'application/json','X-Softech-Emergency':'1',...(options.headers||{})}});const data=await response.json();if(!response.ok)throw Error(data.error||'Xato');return data};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){try{const s=await api('/api/emergency/state');meta.textContent=`${s.clubName} • jurnal #${s.journalSequence} • rejim ${new Date(s.availableUntil).toLocaleString('uz-UZ')} gacha`;grid.innerHTML=s.clients.map(c=>`<div class="card"><b>${esc(c.name)}</b> <span class="${c.connected?'online':''}">${c.connected?'Ulangan':'Uzilgan'}</span>${c.activeSession?`<div class="session active">Faol: ${new Date(c.activeSession.endsAt).toLocaleTimeString('uz-UZ',{hour12:false})} gacha</div><button onclick="stopSession('${c.activeSession.sessionId}')">Seansni yopish</button>`:`<div class="session">Moliyaviy hisoblanmaydi</div><select id="m-${c.clientKey}"><option value="30">30 daqiqa</option><option value="60">1 soat</option><option value="120">2 soat</option><option value="180">3 soat</option><option value="300">5 soat</option></select><button onclick="startSession('${c.clientKey}')">Vaqtli seans ochish</button>`}</div>`).join('')||'<div class="muted">Client kompyuterlar qayta ulanishi kutilmoqda…</div>';error.textContent='';}catch(e){error.textContent=e.message;}}
async function startSession(clientKey){try{await api('/api/emergency/start',{method:'POST',body:JSON.stringify({clientKey,minutes:Number(document.getElementById('m-'+clientKey).value),operator:operator.value,note:note.value})});await refresh()}catch(e){error.textContent=e.message}}
async function stopSession(sessionId){try{await api('/api/emergency/stop',{method:'POST',body:JSON.stringify({sessionId})});await refresh()}catch(e){error.textContent=e.message}}
async function retryMain(){try{await api('/api/emergency/retry-main',{method:'POST',body:JSON.stringify({operator:operator.value})});meta.textContent='Asosiy server qayta tekshirilmoqda…'}catch(e){error.textContent=e.message}}
refresh();setInterval(refresh,2000);
</script></body></html>
