name: Build and publish Windows OTA release
on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'New immutable version (example: 1.0.6)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: softech-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ($env:REQUESTED_VERSION) { $version = $env:REQUESTED_VERSION }
          elseif ($env:REF_TYPE -eq 'tag') { $version = $env:REF_NAME -replace '^v','' }
          else { $version = (Get-Content -Raw package.json | ConvertFrom-Json).version }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          if ($version -ne (Get-Content -Raw package.json | ConvertFrom-Json).version) { throw 'Release version must match package.json. Run npm run version:set first.' }
          gh release view "v$version" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release v$version already exists. Set a new version before publishing." }
          $global:LASTEXITCODE = 0
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "DOTNET_EXE=$((Get-Command dotnet).Source)" >> $env:GITHUB_ENV
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run npm test
        id: tests
        run: |
          New-Item -ItemType Directory -Force .test-output | Out-Null
          npm test 2>&1 | Tee-Object -FilePath .test-output/ci-tests.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $failures = Select-String -Path .test-output/ci-tests.log -Pattern '^not ok ', '^# Error', '^#.*uncaughtException' -Context 4,30
            $details = if ($failures) { ($failures | Out-String).Trim() } else { (Get-Content .test-output/ci-tests.log -Tail 100) -join "`n" }
            Write-Output '::error::Tests failed. Open the run Summary or download the test-failure-log artifact for details.'
            Write-Output $details
            '## Failed npm tests' >> $env:GITHUB_STEP_SUMMARY
            '```text' >> $env:GITHUB_STEP_SUMMARY
            $details >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
          exit $testExit
      - name: Save failed test log
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-log
          path: .test-output/ci-tests.log
          if-no-files-found: warn
      - run: ./tests/window-work-area.ps1
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix .tools/postgres-test --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.13
      - run: node tests/postgres-audit.mjs
      - run: node tests/activation-schema.mjs
      - run: node tests/mobile-dashboard-schema.mjs
      - run: node tests/postgres-api-audit.mjs
      - run: dotnet build tests/ClientProtocol/ClientProtocol.csproj
      - run: node tests/client-protocol-audit.mjs
      - run: dotnet run --project tests/UpdatePolicy/UpdatePolicy.csproj
      - run: dotnet run --project tests/StartupSafety/StartupSafety.csproj
      - run: dotnet run --project tests/ClientAutoStart/ClientAutoStart.csproj
      - run: dotnet build SoftechUpdater/SoftechUpdater.csproj
      - run: dotnet build tests/FixtureClient/FixtureClient.csproj
      - run: node tests/updater-transaction.mjs
      - run: node tests/updater-server-transaction.mjs
      - run: dotnet build NetCafeServer/Service/SoftechService.csproj
      - run: node tests/server-service.mjs
      - run: node tests/service-emergency-fallback.mjs
      - name: Verify cancellation drains the real backend
        run: |
          dotnet build tests/ServiceCancellation/ServiceCancellation.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Cancellation fixture build failed' }
          $env:SOFTECH_SERVICE_EXE = (Resolve-Path tests/ServiceCancellation/bin/Debug/net8.0-windows/win-x64/ServiceCancellation.exe).Path
          node tests/server-service.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Backend cancellation test failed' }
          $env:SOFTECH_SERVICE_TEST_SHUTDOWN = '1'
          node tests/server-service.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Backend Windows shutdown test failed' }
      - name: Publish and verify real Windows service on disposable runner
        id: service_test
        run: |
          dotnet publish NetCafeServer/Service/SoftechService.csproj -c Release -p:PublishDir=../../.test-output/service-publish/ -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw 'Service publish failed' }
          dotnet run --project tests/ServerService/ServerService.csproj -- --probe-tests
          if ($LASTEXITCODE -ne 0) { throw 'Stopped backend probe tests failed' }
          dotnet run --project tests/ServerService/ServerService.csproj -- .test-output/service-publish/SoftechService.exe (Get-Command node).Source
          if ($LASTEXITCODE -ne 0) { throw 'Windows service lifecycle test failed' }
      - name: Save failed Windows service diagnostics
        if: ${{ failure() && steps.service_test.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-service-failure-log
          path: .test-output/scm-*/logs/*.log
          if-no-files-found: warn
      - name: Build complete payloads and bootstrap installers
        run: ./scripts/build-release.ps1 -Version $env:RELEASE_VERSION -Repository $env:GITHUB_REPOSITORY
      - name: Verify packaged applications
        run: node tests/release-artifacts.mjs $env:RELEASE_VERSION
      - name: Verify unlicensed update staging and busy installation with data preservation
        run: node tests/updater-network-staging.mjs $env:RELEASE_VERSION --apply-busy
      - uses: actions/upload-artifact@v4
        with:
          name: softech-${{ env.RELEASE_VERSION }}
          path: Releases/v${{ env.RELEASE_VERSION }}/*
      - name: Publish only after every asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $assets = (Get-ChildItem -LiteralPath "Releases/$tag" -File).FullName
          gh release create $tag @assets --draft --target $env:GITHUB_SHA --title "Softech $tag" --notes-file RELEASE-NOTES.txt
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
