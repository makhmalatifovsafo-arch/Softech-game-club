name: Build and publish Windows OTA release
on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'New immutable version (example: 1.0.6)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: softech-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Resolve version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ($env:REQUESTED_VERSION) { $version = $env:REQUESTED_VERSION }
          elseif ($env:REF_TYPE -eq 'tag') { $version = $env:REF_NAME -replace '^v','' }
          else { $version = (Get-Content -Raw package.json | ConvertFrom-Json).version }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          if ($version -ne (Get-Content -Raw package.json | ConvertFrom-Json).version) { throw 'Release version must match package.json. Run npm run version:set first.' }
          gh release view "v$version" --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release v$version already exists. Set a new version before publishing." }
          $global:LASTEXITCODE = 0
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "DOTNET_EXE=$((Get-Command dotnet).Source)" >> $env:GITHUB_ENV
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: ./tests/window-work-area.ps1
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix .tools/postgres-test --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.13
      - run: node tests/postgres-audit.mjs
      - run: node tests/activation-schema.mjs
      - run: node tests/postgres-api-audit.mjs
      - run: dotnet build tests/ClientProtocol/ClientProtocol.csproj
      - run: node tests/client-protocol-audit.mjs
      - run: dotnet run --project tests/UpdatePolicy/UpdatePolicy.csproj
      - run: dotnet run --project tests/StartupSafety/StartupSafety.csproj
      - run: dotnet build SoftechUpdater/SoftechUpdater.csproj
      - run: dotnet build tests/FixtureClient/FixtureClient.csproj
      - run: node tests/updater-transaction.mjs
      - name: Build complete payloads and bootstrap installers
        run: ./scripts/build-release.ps1 -Version $env:RELEASE_VERSION -Repository $env:GITHUB_REPOSITORY
      - name: Verify packaged applications
        run: node tests/release-artifacts.mjs $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: softech-${{ env.RELEASE_VERSION }}
          path: Releases/v${{ env.RELEASE_VERSION }}/*
      - name: Publish only after every asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $assets = (Get-ChildItem -LiteralPath "Releases/$tag" -File).FullName
          gh release create $tag @assets --draft --target $env:GITHUB_SHA --title "Softech $tag" --notes-file RELEASE-NOTES.txt
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
